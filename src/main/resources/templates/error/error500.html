<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${error}">Ошибка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .status-code {
            font-size: 24px;
            color: #999;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .error-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .error-message {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 8px;
            text-align: left;
        }
        .btn-back {
            display: inline-block;
            padding: 14px 32px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-back:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .tips {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            text-align: left;
        }
        .tips h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .tips ul {
            list-style: none;
            padding: 0;
        }
        .tips li {
            padding: 8px 0;
            color: #666;
            padding-left: 25px;
            position: relative;
        }
        .tips li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="icon">
        <span th:if="${status == 413}">📸</span>
        <span th:unless="${status == 413}">⚠️</span>
    </div>

    <div class="status-code" th:text="'Ошибка ' + ${status}">Ошибка 413</div>
    <h1 class="error-title" th:text="${error}">Файл слишком большой</h1>

    <div class="error-message" th:text="${message}">
        ⚠️ Файл слишком большой. Максимальный размер: 1 MB.
    </div>

    <a href="javascript:history.back()" class="btn-back">← Выбрать другой файл</a>

    <div class="tips" th:if="${status == 413}">
        <h3>💡 Как уменьшить размер фото:</h3>
        <ul>
            <li>Сожмите изображение в онлайн-редакторе</li>
            <li>Уменьшите разрешение фото</li>
            <li>Сохраните в формате JPEG вместо PNG</li>
            <li>Используйте приложения для сжатия фото</li>
        </ul>
    </div>
</div>
</body>
</html>
