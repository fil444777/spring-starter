<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<div th:if="${param.error}" style="color: red;">
    Invalid username or password.
</div>

<div th:if="${param.logout}" style="color: green;">
    You have been logged out.
</div>

<div th:insert="~{fragment :: locale}"></div>
<form th:action="@{/login}" method="post">
<!--    <input type="hidden"-->
<!--           th:name="${_csrf.parameterName}"-->
<!--           th:value="${_csrf.token}">-->
    <label for="username"><span th:text="#{login.username}">Username:</span>
        <input id="username" type="text" name="username" required>
    </label><br>
    <label for="password"><span th:text="#{login.password}">Password:</span>
        <input id="password" type="password" name="password" required>
    </label><br>
    <button type="submit">Login</button>
</form>

<form action="/users/registration">
    <button type="submit">Registration</button>
</form>
</body>
</html>
